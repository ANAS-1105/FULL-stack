<!DOCTYPE html>
<html>
<head>
    <title>Task 11</title>
</head>

<body style="text-align:center; font-family:Arial;">

<h2>Task-11</h2>


<button onclick="changeBg()">Change Background</button>

<br><br>

<input type="text" onkeyup="showText(this.value)" placeholder="Type here">
<p id="live"></p>

<br>

<input type="password" id="pass" placeholder="Enter password">
<button onclick="togglePass()">Show/Hide</button>

<br><br>

<img id="slider" src="https://picsum.photos/id/101/200" width="150">
<br>
<button onclick="nextImg()">Next Image</button>

<br><br>

<button onclick="decrease()">-</button>
<span id="count">0</span>
<button onclick="increase()">+</button>

<script>

function changeBg(){
    document.body.style.background = "yellow";
}

function showText(value){
    document.getElementById("live").innerText = value;
}

function togglePass(){
    let p = document.getElementById("pass");
    if(p.type === "password"){
        p.type = "text";
    } else {
        p.type = "password";
    }
}


let images = [
    "https://picsum.photos/id/101/200",
    "https://picsum.photos/id/102/200",
    "https://picsum.photos/id/103/200"
];

let i = 0;

function nextImg(){
    i = (i + 1) % images.length;
    document.getElementById("slider").src = images[i];
}

let count = 0;

function increase(){
    count++;
    document.getElementById("count").innerText = count;
}

function decrease(){
    count--;
    document.getElementById("count").innerText = count;
}

</script>

</body>
</html>
