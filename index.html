<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form & Input Events</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<h1>Form & Input Events</h1>

<!-- onchange -->
<div class="block">
  <h3>onchange (Dropdown)</h3>
  <select onchange="alert('Changed!')">
    <option value="">vivo</option>
    <option>iphone</option>
    <option>samsung</option>
  </select>
</div>

<!-- oninput / onchange -->
<div class="block">
  <h3>oninput / onchange (Text)</h3>
  <input type="text" 
         oninput="console.log('Input changed')" 
         onchange="alert('Value finalized')" 
         placeholder="write here">
</div>

<!-- oninvalid / onsubmit / onreset -->
<div class="block">
  <h3>oninvalid / onsubmit / onreset</h3>
  <form onsubmit="alert('Form submitted!'); return false;" 
        onreset="alert('Form reset!')">
    <input type="email" required placeholder="Email">
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>
</div>

<!-- onsearch -->
<div class="block">
  <h3>onsearch</h3>
  <input type="search" 
         onsearch="alert('Searched successfully')" 
         placeholder="Search...">
</div>

<!-- onselect -->
<div class="block">
  <h3>onselect</h3>
  <input type="text" 
         value="Try selecting this" 
         onselect="alert('Text selected')">
</div>

</body>
</html>
